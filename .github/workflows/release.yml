name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    if: github.repository == '0ranko0P/TiebaLite'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version-file: .github/.java-version

      - name: Generate keystore
        run: |
          echo ${{ secrets.KEYSTORE }} | /usr/bin/base64 --decode > key.jks
          echo KEYSTORE_FILE="key.jks" > signing.properties
          echo KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" >> signing.properties
          echo KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" >> signing.properties
          echo KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}" >> signing.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: false
          cache-provider: enhanced

      - name: Build project
        run: ./gradlew assembleRelease

      - name: Rename release apk
        run: |
          sha=`echo ${{ github.sha }} | cut -c1-8`
          version_code=`jq -r ".elements[0].versionCode" app/build/outputs/apk/release/output-metadata.json`
          version="TiebaLite-${{ github.ref_name }}+${sha}.$version_code"
          mv app/build/outputs/apk/release/app-release.apk "$version.apk"

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping
          path: ./app/build/outputs/mapping/release
          compression-level: 9

      - name: Upload release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact
          path: 'TiebaLite-*.apk'

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build]

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact
          path: out
          merge-multiple: true

      - name: Delete release artifact
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: release-artifact
          failOnError: false

      - name: Github Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: 'out/TiebaLite-*.apk'
