syntax = "proto3";

package tieba.GeneralTabList;

option java_package = "com.huanchengfly.tieba.post.core.network.model.protos.GeneralTabList";

import "CommonRequest.proto";

message GeneralTabListRequestData {
    CommonRequest common = 1;
    int32 tab_id = 2;
    int64 forum_id = 3;
    int32 pn = 4;
    int32 rn = 5;
    int32 scr_w = 6;
    int32 scr_h = 7;
    int32 scr_dip = 8;
    int64 last_thread_id = 9;
    int32 is_default_navtab = 10;
    string tab_name = 11;
    int32 is_general_tab = 12;
    int32 sort_type = 13;
    int32 tab_type = 14;
    string ad_ext_params = 15;
    string ad_bear_context = 16;
    int32 has_ad_bear = 17;
    string ad_bear_sid = 18;
    double ad_bear_sid_price = 19;
    int32 request_times = 20;
    string frs_common_info = 21;
    int32 is_newfrs = 22;
    int32 is_video_doublerow = 23;
}
